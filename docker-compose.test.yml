services:
  test-postgres:
    image: postgres:16-alpine
    container_name: build_any_website_test_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_test_password
      POSTGRES_DB: build_any_website_test
    ports:
      - '5432:5432'
    volumes:
      - test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d build_any_website_test']
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  test_pgdata:
